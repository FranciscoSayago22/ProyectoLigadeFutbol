<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LigaTPM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="d-flex flex-column min-vh-100">


        <!-- Menú de Navegación (Header)  -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <!-- Logo de la Liga / Botón Inicio -->
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <i class="bi bi-trophy-fill me-2 text-warning"></i>
                <span class="fw-bold">LIGA TPM</span>
            </a>
            
            <!-- Botón Hamburguesa para Móviles  -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <!-- Secciones del Menú  -->
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                    <li class="nav-item">
                        <a class="nav-link " href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="equipos.html">Equipos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="posiciones.html">Liga</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="multimedia.html">Multimedia</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="reglamento.html">Reglamento</a>
                    </li>
                    <li class="nav-item ">
                        <a class="nav-link active" href="login.html">
                            <i class="bi bi-person-circle"></i> Login
                        </a>
                    </li>
                    <!-- Botón de Descargar con formato especial  -->
                    <li class="nav-item ms-lg-3">
                        <a class="btn btn-outline-warning btn-sm" href="download.html">
                            <i class="bi bi-download"></i> Descargar
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    <main class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
        <div class="card shadow-lg border-" style="max-width: 400px; width: 100%;">
            <br>    
            <div class="card-header bg-dark text-white text-center py-4">
                <i class="bi bi-person-circle display-4"></i>
                <h2 class="mt-2 h4">Iniciar Sesión</h2>
            </div>
            <div class="card-body p-4">
                <form id="formLogin" novalidate>
                    <div class="mb-3">
                        <label for="email" class="form-label texto-negro">Correo Electrónico</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" placeholder="ejemplo@correo.com" required>
                        </div>
                        <div id="errorEmail" class="text-danger small mt-1 d-none"> </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label texto-negro">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" placeholder="********" required>
                        </div>
                        <div id="errorPass" class="text-danger small mt-1 d-none"></div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 fw-bold py-2">
                        INGRESAR <i class="bi bi-box-arrow-in-right ms-2"></i>
                    </button>
                </form>
            </div>
            <div class="card-footer text-center py-3 bg-white">
                <a href="#" class="text-decoration-none small">¿Olvidaste tu contraseña?</a>
                <hr>
                <p class="small mb-0 texto-negro">¿Eres nuevo? <a href="registro.html" class="fw-bold">Regístrate</a></p>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white pt-4 pb-2 mt-auto">
        <div class="container text-center">
            <p>Liga TPM - Internacional Latam &copy; 2026</p>
            <div class="mb-2">
                <a href="https://www.youtube.com/@TPMFootball/featured" class="text-white me-3 fs-5"><i class="bi bi-youtube"></i></a>
                <a href="https://www.twitch.tv/ligatpm" class="text-white me-3 fs-5"><i class="bi bi-twitch"></i></a>
                <a href="https://www.instagram.com/ligatpm" class="text-white fs-5"><i class="bi bi-instagram"></i></a>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
