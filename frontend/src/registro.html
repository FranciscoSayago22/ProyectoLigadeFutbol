<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario - LigaTPM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- Menú de Navegación (Header)  -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <!-- Logo de la Liga / Botón Inicio -->
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <i class="bi bi-trophy-fill me-2 text-warning"></i>
                <span class="fw-bold">LIGA TPM</span>
            </a>

            <!-- Botón Hamburguesa para Móviles  -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
                aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <!-- Secciones del Menú  -->
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                    <li class="nav-item">
                        <a class="nav-link " href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="equipos.html">Equipos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="posiciones.html">Liga</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="multimedia.html">Multimedia</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="reglamento.html">Reglamento</a>
                    </li>
                    <li class="nav-item ">
                        <a class="nav-link active" href="login.html">
                            <i class="bi bi-person-circle"></i> Login
                        </a>
                    </li>
                    <!-- Botón de Descargar con formato especial  -->
                    <li class="nav-item ms-lg-3">
                        <a class="btn btn-outline-warning btn-sm" href="download.html">
                            <i class="bi bi-download"></i> Descargar
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container d-flex align-items-center justify-content-center my-5 pt-5" style="min-height: 85vh;">
        <div class="card shadow-lg border-0" style="max-width: 500px; width: 100%;">
            <div class="card-header bg-dark text-white text-center py-4">
                <i class="bi bi-person-plus-fill display-4 text-warning"></i>
                <h2 class="mt-2 h4">Registro</h2>
            </div>
            <div class="card-body p-4">
                <form id="formRegistro" novalidate>
                    <h5 class="text-warning mb-3 border-bottom border-secondary pb-2">Datos Personales</h5>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="regNombre" class="form-label text-white">Nombre</label>
                            <input type="text" class="form-control componente-oscuro-liga" id="regNombre" required>
                        </div>
                        <div class="col-md-6 mt-3 mt-md-0">
                            <label for="regApellido" class="form-label text-white">Apellido</label>
                            <input type="text" class="form-control componente-oscuro-liga" id="regApellido" required>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="regDni" class="form-label text-white">DNI</label>
                            <input type="number" class="form-control componente-oscuro-liga" id="regDni" required>
                        </div>
                        <div class="col-md-6 mt-3 mt-md-0">
                            <label for="regDireccion" class="form-label text-white">Dirección</label>
                            <input type="text" class="form-control componente-oscuro-liga" id="regDireccion" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="regEmail" class="form-label text-white">Correo Electrónico</label>
                        <input type="email" class="form-control componente-oscuro-liga" id="regEmail" required>
                    </div>

                    <h5 class="text-warning mb-3 border-bottom border-secondary pb-2">Participación</h5>
                    <div class="mb-4">
                        <label for="regRol" class="form-label text-white">¿Cómo deseas sumarte a la Liga?</label>
                        <select class="form-select componente-oscuro-liga" id="regRol" required>
                            <option value="" selected disabled>Selecciona un rol...</option>
                            <option value="jugador">Quiero ser Jugador (Agente Libre)</option>
                            <option value="manager">Quiero ser Manager (Inscribir un Equipo)</option>
                        </select>
                    </div>

                    <div id="camposManager" class="d-none p-3 mb-4 border border-warning rounded bg-dark">
                        <h5 class="text-warning mb-3"><i class="bi bi-shield-check"></i> Datos del Equipo</h5>
                        <div class="mb-3">
                            <label for="regNombreEquipo" class="form-label text-white">Nombre del Equipo</label>
                            <input type="text" class="form-control componente-oscuro-liga manager-input">
                        </div>
                        <div class="mb-3">
                            <label for="regEstadio" class="form-label text-white">Estadio Virtual</label>
                            <input type="text" class="form-control componente-oscuro-liga manager-input">
                        </div>
                        <div class="mb-3">
                            <label for="regHistoria" class="form-label text-white">Historia del Equipo</label>
                            <textarea class="form-control componente-oscuro-liga manager-input" id="regHistoria"
                                rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="regLogo" class="form-label text-white">Logo del Equipo</label>
                            <input type="file" class="form-control componente-oscuro-liga manager-input" id="regLogo"
                                accept="image/*">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-warning w-100 fw-bold py-2 mt-2 text-dark">
                        ENVIAR SOLICITUD A LA LIGA <i class="bi bi-send-check ms-2"></i>
                    </button>
                </form>
            </div>
            <div class="card-footer text-center py-3 bg-white">
                <p class="small mb-0 text-dark">¿Ya tienes cuenta? <a href="login.html" class="fw-bold">Inicia
                        Sesión</a></p>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white pt-4 pb-2 mt-auto">
        <div class="container text-center">
            <p>Liga TPM - Internacional Latam &copy; 2026</p>
            <div class="mb-2">
                <a href="https://www.youtube.com/@TPMFootball/featured" class="text-white me-3 fs-5"><i
                        class="bi bi-youtube"></i></a>
                <a href="https://www.twitch.tv/ligatpm" class="text-white me-3 fs-5"><i class="bi bi-twitch"></i></a>
                <a href="https://www.instagram.com/ligatpm" class="text-white fs-5"><i class="bi bi-instagram"></i></a>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
