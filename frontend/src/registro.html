        <div class="container">
            <!-- Logo de la Liga / Botón Inicio -->
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <i class="bi bi-trophy-fill me-2 text-warning"></i>
                <span class="fw-bold">LIGA TPM</span>
            </a>
            
            <!-- Botón Hamburguesa para Móviles  -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <!-- Secciones del Menú  -->
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                    <li class="nav-item">
                        <a class="nav-link " href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="equipos.html">Equipos</a>

                    <li class="nav-item">
                        <a class="nav-link" href="reglamento.html">Reglamento</a>
                    </li>
                    <li class="nav-item ">
                        <a class="nav-link active" href="login.html">
                            <i class="bi bi-person-circle"></i> Login
                        </a>
                    </li>
                    <!-- Botón de Descargar con formato especial  -->
                    <li class="nav-item ms-lg-3">
                        <a class="btn btn-outline-warning btn-sm" href="download.html">
                            <i class="bi bi-download"></i> Descargar
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    <main class="container d-flex align-items-center justify-content-center my-5 pt-5" style="min-height: 85vh;">
        <div class="card shadow-lg border-0" style="max-width: 500px; width: 100%;">
            <div class="card-header bg-dark text-white text-center py-4">
                <i class="bi bi-person-plus-fill display-4 text-warning"></i>
                <h2 class="mt-2 h4">Registro de Manager</h2>
            </div>
            <div class="card-body p-4">
                <form id="formRegistro" novalidate>
                    <h5 class="fw-bold mb-3 border-bottom pb-2 texto-negro">Datos Personales</h5>
                    
                    <div class="mb-3">
                        <label for="regEmail" class="form-label text-dark">Correo Electrónico (Formatos Latam)</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="regEmail" placeholder="usuario@dominio.cl, .ar, .co..." required>
                        </div>
                        <div id="errorRegEmail" class="text-danger small mt-1 d-none"></div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="regPassword" class="form-label text-dark">Contraseña (Mín. 6 caracteres)</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="regPassword" placeholder="******" required>
                        </div>
                        <div id="errorRegPass" class="text-danger small mt-1 d-none"></div>
                    </div>

                    <h5 class="fw-bold my-3 border-bottom pb-2 texto-negro">Datos del Club</h5>

                    <div class="mb-3">
                        <label for="regNombreEquipo" class="form-label text-dark">Nombre de tu Equipo</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-shield-shaded"></i></span>
                            <input type="text" class="form-control" id="regNombreEquipo" placeholder="Ej: Rayo Virtual" required>
                        </div>
                        <div id="errorRegNombreEquipo" class="text-danger small mt-1 d-none">El nombre del equipo es obligatorio.</div>
                    </div>

                    <div class="mb-3">
                        <label for="regEstadio" class="form-label text-dark">Nombre de tu Estadio</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
                            <input type="text" class="form-control" id="regEstadio" placeholder="Ej: Estadio del Plata" required>
                        </div>
                        <div id="errorRegEstadio" class="text-danger small mt-1 d-none">El nombre del estadio es obligatorio.</div>
                    </div>

                    <button type="submit" class="btn btn-warning w-100 fw-bold py-2 mt-3 text-dark">
                        REGISTRARSE E INGRESAR LIGA <i class="bi bi-check-circle ms-2"></i>
                    </button>
                </form>
            </div>
            <div class="card-footer text-center py-3 bg-white">
                <p class="small mb-0 text-dark">¿Ya tienes cuenta? <a href="login.html" class="fw-bold">Inicia Sesión</a></p>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white pt-4 pb-2 mt-auto">

                <a href="#" class="text-white fs-5"><i class="bi bi-instagram"></i></a>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
